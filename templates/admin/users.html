{% extends "base.html" %}
{% block title %}用户管理{% endblock %}
{% block content %}
    <div class="page-header">
        <h2 class="page-title">用户列表</h2>
        <div class="page-actions">
            <a href="{{ url_for('create_user') }}" class="btn btn-primary">创建新用户</a>
        </div>
    </div>
    <div class="app-card">
        <div class="table-responsive">
            <table class="table table-hover table-modern">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>用户名</th>
                        <th>角色</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr>
                        <td>{{ user.id }}</td>
                        <td>{{ user.username }}</td>
                        <td><span class="badge badge-{{ 'success' if user.role == 'admin' else 'secondary' }}">{{ user.role }}</span></td>
                        <td>
                            <div class="table-actions">
                                {% if user.role != 'admin' %}
                                <a href="{{ url_for('edit_user', user_id=user.id) }}" class="btn btn-sm btn-secondary">修改密码</a>
                                {% endif %}
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
{% endblock %}
