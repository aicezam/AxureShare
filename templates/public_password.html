{% extends "base.html" %}
{% block title %}需要密码{% endblock %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="app-card-public-password">
                <div class="page-title-group mb-3">
                    <h2 class="page-title">访问受保护的原型</h2>
                    <div class="text-muted">原型: {{ proto.name }}</div>
                </div>
                <p>此原型为公开分享，但需要输入访问密码。</p>
                <form method="POST" action="">
                    {{ form.hidden_tag() }}
                    <div class="mb-3">
                        {{ form.password(class="form-control", placeholder="请输入密码") }}
                    </div>
                    <div class="d-grid mb-0">
                        {{ form.submit(class="btn btn-primary") }}
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
